[project]
name = "daeri-resource-db-postgres"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["postgres-mcp==0.3.0"]

[tool.uv]
package = false
# This package uses the SDK v1 FastMCP API.
constraint-dependencies = ["mcp<2"]
# Upstream pins unavailable pglast==7.2.0; use the verified 7.20 override.
override-dependencies = ["pglast==7.20"]
