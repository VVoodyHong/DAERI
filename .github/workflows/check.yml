name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      native:
        description: Run macOS checks and native Windows bootstrap regressions
        type: boolean
        default: false
      local_model:
        description: Download and evaluate the public local embedding model
        type: boolean
        default: false
      clean_bootstrap:
        description: Prepare DAERI from a clean macOS and Windows checkout
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    name: Ubuntu / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read uv version
        id: uv
        run: awk -F= '$1 == "UV_INSTALL_VERSION" {print "version=" $2}' scripts/dependencies.env >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ steps.uv.outputs.version }}
          python-version: ${{ matrix.python }}
      - name: Install recipe Python and locked development environment
        run: |
          uv python install 3.12
          uv sync --frozen
      - name: Run checks
        run: uv run --no-sync python -m scripts.check
      - name: Publish summary
        if: always()
        run: |
          if [ -f build/checks/summary.md ]; then
            cat build/checks/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checks-ubuntu-python-${{ matrix.python }}
          path: build/checks/
          if-no-files-found: error

  native:
    name: ${{ matrix.label }}
    if: github.event_name == 'workflow_dispatch' && inputs.native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS / full checks
          - os: windows-latest
            label: Windows / native bootstrap regressions
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read uv version
        id: uv
        run: awk -F= '$1 == "UV_INSTALL_VERSION" {print "version=" $2}' scripts/dependencies.env >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ steps.uv.outputs.version }}
          python-version: '3.12'
      - name: Install locked development environment
        run: uv sync --frozen
      - name: Run macOS checks
        if: runner.os == 'macOS'
        run: uv run --no-sync python -m scripts.check
      - name: Run native Windows bootstrap regressions
        id: windows_tests
        if: runner.os == 'Windows'
        run: |
          mkdir -p build/checks
          uv run --no-sync python -m pytest -q tests/test_bootstrap.py -k windows --junitxml=build/checks/pytest.xml 2>&1 | tee build/checks/pytest.log
      - name: Summarize native Windows result
        if: always() && runner.os == 'Windows'
        run: |
          mkdir -p build/checks
          printf '# Native Windows bootstrap regressions\n\nResult: %s\n\nScope: `tests/test_bootstrap.py -k windows`; detailed results and skipped reasons are in `pytest.xml` and `pytest.log`.\n' '${{ steps.windows_tests.outcome }}' > build/checks/summary.md
      - name: Publish summary
        if: always()
        run: |
          if [ -f build/checks/summary.md ]; then
            cat build/checks/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checks-native-${{ runner.os }}
          path: build/checks/
          if-no-files-found: error

  local_model:
    name: Prepared local model / semantic recall
    if: github.event_name == 'workflow_dispatch' && inputs.local_model
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DAERI_TEST_MODEL_CACHE: ${{ github.workspace }}/build/model-cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read uv version
        id: uv
        run: awk -F= '$1 == "UV_INSTALL_VERSION" {print "version=" $2}' scripts/dependencies.env >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ steps.uv.outputs.version }}
          python-version: '3.12'
      - name: Install locked development environment
        run: uv sync --frozen --extra local-embedding
      - name: Prepare public embedding model
        id: prepare_model
        run: |
          mkdir -p build/checks
          uv run --no-sync python -c "import os; from daeri.infrastructure.memory import LocalEmbedder; LocalEmbedder.prepare(os.environ['DAERI_TEST_MODEL_CACHE'])" > build/checks/model-prepare.log 2>&1
      - name: Verify actual model without DNS
        id: model_test
        run: uv run --no-sync python -m pytest -q tests/test_memory.py::test_actual_local_multilingual_model_retrieves_without_network --junitxml=build/checks/pytest.xml 2>&1 | tee build/checks/pytest.log
      - name: Evaluate semantic recall
        id: recall
        run: uv run --no-sync python -m evaluations.memory_recall --provider local --model-cache "$DAERI_TEST_MODEL_CACHE" --output build/checks/memory-recall.json > build/checks/memory-recall.log 2>&1
      - name: Publish local model summary
        if: always()
        run: |
          mkdir -p build/checks
          printf '# Actual local embedding model\n\nPublic model preparation: %s\n\nOffline regression: %s\n\nFixed synthetic recall evaluation: %s\n\nScores and limitations are recorded in `memory-recall.json` when evaluation completes.\n' '${{ steps.prepare_model.outcome }}' '${{ steps.model_test.outcome }}' '${{ steps.recall.outcome }}' > build/checks/summary.md
          cat build/checks/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checks-local-model
          path: build/checks/
          if-no-files-found: error

  clean_bootstrap:
    name: Clean preparation / ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' && inputs.clean_bootstrap
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare clean macOS runtime
        id: macos_prepare
        if: runner.os == 'macOS'
        env:
          DAERI_DATA_DIR: ${{ runner.temp }}/daeri-bootstrap-data
        shell: bash
        run: |
          mkdir -p build/checks
          sh scripts/setup.sh --prepare > build/checks/prepare.stdout.log 2> build/checks/prepare.stderr.log
          test -f .mcp.json
          .venv/bin/python.exe -I -m daeri.cli check > build/checks/runtime-check.json 2> build/checks/runtime-check.stderr.log
      - name: Prepare clean Windows runtime
        id: windows_prepare
        if: runner.os == 'Windows'
        env:
          DAERI_DATA_DIR: ${{ runner.temp }}/daeri-bootstrap-data
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/checks | Out-Null
          powershell -NoProfile -ExecutionPolicy RemoteSigned -File scripts/setup.ps1 -Prepare 1> build/checks/prepare.stdout.log 2> build/checks/prepare.stderr.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath .mcp.json -PathType Leaf)) { throw 'Prepared MCP configuration is missing.' }
          & ./.venv/bin/python.exe -I -m daeri.cli check 1> build/checks/runtime-check.json 2> build/checks/runtime-check.stderr.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish preparation summary
        if: always()
        shell: bash
        run: |
          mkdir -p build/checks
          printf '# Clean runtime preparation\n\nOS: %s\n\nmacOS preparation: %s\n\nWindows preparation: %s\n\nThe preparation step includes MCP configuration publication and the prepared runtime check.\n' '${{ runner.os }}' '${{ steps.macos_prepare.outcome }}' '${{ steps.windows_prepare.outcome }}' > build/checks/summary.md
          cat build/checks/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checks-clean-bootstrap-${{ runner.os }}
          path: build/checks/
          if-no-files-found: error
