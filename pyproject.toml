[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "daeri-agent"
version = "0.1.30"
description = "Local MCP runtime for DAERI multi-agent orchestration, approvals and profile memory"
requires-python = ">=3.12,<3.15"
dependencies = [
  "mcp>=1.30,<2",
  "pydantic>=2.11,<3",
  "jsonschema>=4.20,<5",
  "httpx>=0.28,<1",
  "sqlite-vec>=0.1.9,<0.2",
  "keyring>=25.6,<26",
  "pyyaml>=6,<7",
  "cryptography>=50,<51",
]

[project.optional-dependencies]
local-embedding = ["fastembed>=0.9,<1"]

[project.scripts]
daeri = "daeri.cli:main"
daeri-mcp = "daeri.server:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/daeri"]

[tool.hatch.build.targets.wheel.force-include]
"recipes" = "daeri/recipes"

[tool.hatch.build.targets.sdist]
exclude = ["/.mcp.json", "/.mcp.prepare.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
