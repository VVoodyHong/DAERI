<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1600" viewBox="0 0 1800 1600" role="img" aria-labelledby="title desc">
  <title id="title">DAERI 아키텍처</title>
  <desc id="desc">업무 요청, 기억 회상, 계획 제시, 사용자 승인, 작업 위임, 도구 실행, 결과 보고, 경험 저장의 흐름. Claude Code와 Codex의 접속부가 DAERI 서비스로 요청을 전달한다. DAERI는 프로젝트 공유 지식을 자동 회상해 AgentCore의 총괄 harness에 제공한다. 하위 에이전트는 개별 harness를 MCP 도구로 연결하는 구성안이다. 에이전트들이 승인 범위에서 협업하고 Gateway를 통해 프로젝트 도구를 실행한다. DAERI는 응답과 업무 기록을 보존하고 경험 정리와 임베딩을 거쳐 공유 지식을 갱신한다. AgentCore Memory는 업무별 대화를 저장하고 복구한다.</desc>
