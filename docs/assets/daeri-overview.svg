<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1380" viewBox="0 0 1800 1380" role="img" aria-labelledby="title desc">
  <title id="title">DAERI 프로젝트 연결과 업무 흐름</title>
  <desc id="desc">운영자가 검증한 MCP 패키지·원격 MCP·OpenAPI를 준비한다. 프로젝트 관리자가 실제 호스트 입력창에서 연결 정보를 등록하면 DAERI 연결 관리자가 프로젝트 고정 설정으로 필요한 MCP Runtime을 배포하고 Gateway에 등록한다. 구성원은 같은 프로젝트 연결과 Memory를 공유하고 각자의 업무에서 계획을 승인한다. Harness가 총괄·하위 에이전트를 실행하고 Gateway를 통해 MCP Runtime에서 DB에 접근하거나 기존 원격 MCP와 OpenAPI를 호출한다. 결과와 피드백은 프로젝트 경험으로 축적한다. DAERI 접속부 Runtime과 리소스 MCP Runtime은 별도이며 READY는 도구 발견 상태다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 9 5 1 9" fill="none" stroke="#708096" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#203247}
      .title{font-size:38px;font-weight:750}.subtitle{font-size:24px;fill:#596b80}.heading{font-size:28px;font-weight:700}.body{font-size:23px;fill:#4e6277}.small{font-size:21px;fill:#5e7084}.tag{font-size:23px;font-weight:700}.line{fill:none;stroke:#708096;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 7}.aws{fill:#414779}.daeri{fill:#16776f}
    </style>
  </defs>
  <rect width="1800" height="1380" fill="#fff"/>
  <text x="55" y="65" class="title">DAERI · 프로젝트 연결부터 경험 재사용까지</text>
  <text x="55" y="110" class="subtitle">한 번 등록한 연결과 누적 기억은 함께 사용하고, 업무와 승인은 각자 관리합니다.</text>
  <g aria-label="구현 책임 범례">
    <rect x="1320" y="30" width="190" height="40" rx="8" fill="#eef0f8"/><text x="1415" y="58" text-anchor="middle" class="small aws">AWS 관리형</text>
    <rect x="1530" y="30" width="215" height="40" rx="8" fill="#ebf6f2"/><text x="1637" y="58" text-anchor="middle" class="small daeri">DAERI 구현</text>
  </g>

  <rect x="55" y="150" width="1690" height="295" rx="20" fill="#f5f8fb" stroke="#dce3eb"/>
  <text x="85" y="190" class="tag">프로젝트 연결 준비·등록</text>
  <g text-anchor="middle">
    <rect x="85" y="220" width="340" height="160" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <text x="255" y="262" class="heading">운영자</text>
    <text x="255" y="304" class="body">검증한 커넥터 준비</text>
    <text x="255" y="344" class="small">MCP 패키지 · 원격 MCP · OpenAPI</text>
    <rect x="515" y="220" width="340" height="160" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <text x="685" y="262" class="heading">프로젝트 관리자</text>
    <text x="685" y="304" class="body">커넥터 선택·접속 정보 입력</text>
    <text x="685" y="344" class="small">실제 호스트 확인창에서 한 번 등록</text>
    <rect x="945" y="220" width="340" height="160" rx="14" fill="#ebf6f2" stroke="#b7d8d0"/>
    <text x="1115" y="262" class="heading daeri">DAERI 연결 관리자</text>
    <text x="1115" y="304" class="body">프로젝트 고정 설정 적용</text>
    <text x="1115" y="344" class="small">필요한 MCP Runtime 배포</text>
    <rect x="1375" y="220" width="340" height="160" rx="14" fill="#eef0f8" stroke="#c6cbe1"/>
    <text x="1545" y="262" class="heading aws">프로젝트 Gateway</text>
    <text x="1545" y="304" class="body">endpoint·인증 등록</text>
    <text x="1545" y="344" class="small">같은 프로젝트 구성원이 공유</text>
  </g>
  <path d="M425 300H515" class="line"/><path d="M855 300H945" class="line"/><path d="M1285 300H1375" class="line"/>
  <text x="85" y="419" class="small">같은 MCP 이미지를 프로젝트·연결별 설정으로 재사용합니다. 기존 원격 MCP·REST API는 필요한 대상에 직접 등록합니다.</text>

  <text x="55" y="510" class="tag">구성원의 업무 요청·계획 승인·자율 수행</text>
  <g text-anchor="middle">
    <rect x="85" y="550" width="340" height="215" rx="16" fill="#f5f8fb" stroke="#cbd5e1"/>
    <text x="255" y="596" class="heading">프로젝트 구성원</text>
    <text x="255" y="642" class="body">Claude Code · Codex</text>
    <text x="255" y="683" class="body">목표·조건·피드백</text>
    <text x="255" y="727" class="small">자신의 업무에서 계획 승인</text>
    <rect x="515" y="550" width="340" height="215" rx="16" fill="#ebf6f2" stroke="#b7d8d0"/>
    <text x="685" y="596" class="heading daeri">DAERI 서비스</text>
    <text x="685" y="642" class="body">회사 로그인·프로젝트 검사</text>
    <text x="685" y="683" class="body">업무·승인·세션 연결</text>
    <text x="685" y="727" class="small">접속부 전용 Runtime · S3 원본</text>
    <rect x="945" y="550" width="340" height="215" rx="16" fill="#eef0f8" stroke="#c6cbe1"/>
    <text x="1115" y="596" class="heading aws">AgentCore Harness</text>
    <text x="1115" y="642" class="body">총괄·하위 에이전트 협업</text>
    <text x="1115" y="683" class="body">기억 검색·계획·자율 수행</text>
    <text x="1115" y="727" class="small">현재 승인 hook 검사</text>
    <rect x="1375" y="550" width="340" height="215" rx="16" fill="#eef0f8" stroke="#c6cbe1"/>
    <text x="1545" y="596" class="heading aws">프로젝트 Gateway</text>
    <text x="1545" y="642" class="body">공유 도구 호출</text>
    <text x="1545" y="683" class="body">Identity·리소스 권한</text>
    <text x="1545" y="727" class="small">승인 범위에서 실제 작업</text>
  </g>
  <path d="M425 657H515" class="line"/><path d="M855 657H945" class="line"/><path d="M1285 657H1375" class="line"/>
  <path d="M1545 380V550" class="line dashed"/>
  <text x="1568" y="483" class="small">등록한 연결 활용</text>

  <rect x="945" y="825" width="770" height="225" rx="16" fill="#f7f8fc" stroke="#d9deeb"/>
  <text x="975" y="866" class="tag aws">실제 리소스 호출 경로</text>
  <text x="975" y="919" class="body">Gateway → 연결별 MCP Runtime → DB·내부 리소스</text>
  <text x="975" y="964" class="body">Gateway → 기존 원격 MCP / OpenAPI → 외부 API</text>
  <text x="975" y="1011" class="small">MCP Runtime은 DAERI 접속부 Runtime과 별도로 실행</text>
  <path d="M1545 765V825" class="line"/>

  <rect x="85" y="825" width="770" height="225" rx="16" fill="#ebf6f2" stroke="#b7d8d0"/>
  <text x="115" y="866" class="tag daeri">결과·근거·파일 보고</text>
  <text x="115" y="919" class="body">총괄 에이전트가 결과 통합 → DAERI가 원본 보존</text>
  <text x="115" y="964" class="body">사용자는 결과를 확인하고 같은 업무에 피드백</text>
  <text x="115" y="1011" class="small">READY는 마지막 도구 발견 확인 · 실제 접근은 업무로 확인</text>
  <path d="M945 939H855" class="line"/>

  <rect x="85" y="1120" width="1630" height="175" rx="18" fill="#eef0f8" stroke="#c6cbe1"/>
  <text x="115" y="1163" class="tag aws">AgentCore Memory · 비동기 경험 저장</text>
  <g text-anchor="middle">
    <text x="345" y="1220" class="heading aws">결과·피드백에서 경험 추출</text>
    <text x="895" y="1220" class="heading aws">관련 기억 통합·갱신</text>
    <text x="1440" y="1220" class="heading aws">다음 구성원·업무에서 재사용</text>
  </g>
  <path d="M600 1210H670" class="line dashed"/><path d="M1135 1210H1205" class="line dashed"/>
  <path d="M470 1050V1120" class="line dashed"/>
  <text x="115" y="1265" class="small">프로젝트의 연결·자료·기억은 공유하며, 업무별 목표·계획·실제 승인·실행 세션은 개별 보관합니다.</text>
  <text x="55" y="1345" class="small">채택 구조 · 실제 회사 로그인·호스트·AWS 배포·리소스 연동은 별도 검증 대상</text>
</svg>
