<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1540" viewBox="0 0 1840 1540" role="img" aria-labelledby="title" aria-describedby="desc">
  <title id="title">DAERI 아키텍처와 8단계 업무 흐름</title>
  <desc id="desc">
    1 사용자가 DAERI에 업무를 요청한다. 2 관리형 Harness가 공유 기억을 검색한다.
    3 총괄 에이전트가 계획을 제시하고 4 사용자가 호스트 확인창에서 승인한다.
    5 필요하면 Gateway와 위임 Lambda를 거쳐 하위 Harness에 맡긴다.
    6 에이전트는 승인 범위에서 실행하고 공유 도구는 Gateway에서 호출한다.
    7 DAERI가 사용자에게 결과를 전달하고 8 Memory가 경험을 비동기로 정리한다.
    DAERI 접속부와 프로젝트 MCP 서버는 별도 Runtime에서 실행한다.
    업무 기록과 파일은 S3에 보관한다.
  </desc>
  <defs>
    <style>
      text { font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #23364a; }
      .title { font-size: 44px; font-weight: 700; }
      .zone { font-size: 29px; font-weight: 650; fill: #344e67; }
      .heading { font-size: 30px; font-weight: 700; }
      .detail, .small, .qualifier { fill: #4b6074; }
      .detail { font-size: 25px; }
      .small { font-size: 23px; }
      .stage { font-size: 25px; font-weight: 650; fill: #344e67; }
      .sequence { font-size: 25px; font-weight: 600; }
      .qualifier { font-size: 22px; font-weight: 450; }
      .white { fill: #fff; }
      .teal { fill: #285f54; }
      rect { stroke-width: 2; }
      .route, .arrow { fill: none; stroke: #5d7895; stroke-width: 2.7; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .optional { stroke-dasharray: 10 8; }
      .teal-route { stroke: #538478; marker-end: url(#teal-arrow); }
      .teal-both { marker-start: url(#teal-arrow); }
      .badge { fill: #e6edf4; stroke: #bdcbd9; stroke-width: 1.5; }
      .digit { fill: none; stroke: #344e67; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0L12 6L0 12Z" fill="#5d7895"/>
    </marker>
    <marker id="teal-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0L12 6L0 12Z" fill="#538478"/>
    </marker>
    <g id="step-1"><circle r="23" class="badge"/><path d="M-7-9 0-15V15 M-7 15H8" class="digit"/></g>
    <g id="step-2"><circle r="23" class="badge"/><path d="M-9-8C-9-18 9-18 9-8 9-1-6 6-9 15H10" class="digit"/></g>
    <g id="step-3"><circle r="23" class="badge"/><path d="M-9-12C-4-18 9-17 9-9 9-3 3 0-1 0 5 0 10 3 10 9 10 17-4 18-10 12" class="digit"/></g>
    <g id="step-4"><circle r="23" class="badge"/><path d="M6 15V-15L-11 6H11" class="digit"/></g>
    <g id="step-5"><circle r="23" class="badge"/><path d="M9-15H-7L-9-1C-4-5 9-4 9 6 9 16-3 18-10 12" class="digit"/></g>
    <g id="step-6"><circle r="23" class="badge"/><path d="M8-13C-1-19-10-12-10 3-10 11-6 16 1 16 13 16 14-3 2-3-4-3-8 1-9 4" class="digit"/></g>
    <g id="step-7"><circle r="23" class="badge"/><path d="M-10-15H10C3-5-2 3-4 15" class="digit"/></g>
    <g id="step-8"><circle r="23" class="badge"/><path d="M0-16C12-16 12-4 0 0-14 4-13 16 0 16 13 16 14 4 0 0-12-4-12-16 0-16Z" class="digit"/></g>
  </defs>
