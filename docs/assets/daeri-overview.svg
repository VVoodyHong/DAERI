<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1600" viewBox="0 0 1800 1600" role="img" aria-labelledby="title desc">
  <title id="title">DAERI 서비스 흐름</title>
  <desc id="desc">위에서 아래로 읽는 클라우드 서비스의 목표 흐름. 사용자, AWS에 배포하는 DAERI 서비스, AWS AgentCore, 연결 도구의 네 열로 구분한다. 1 업무 요청은 Claude Code·Codex 플러그인에서 DAERI로 전달된다. 2 기억 검색은 현재 프로젝트·서비스·출처 접근 범위의 PostgreSQL·pgvector 공유 지식을 조회하고 관련 기억을 요청과 함께 managed harness에 제공한다. 3 계획 제시와 4 실제 사용자 승인은 DAERI를 경유한다. 5 총괄 에이전트는 별도 harness를 MCP 도구로 연결한 하위 에이전트에 필요한 작업을 위임한다. 6 연결된 MCP·API는 Gateway·Policy·Identity를 거쳐 호출하고 결과·근거를 반환한다. 기본 shell·파일 도구는 harness의 실행 경계를 따른다. 7 harness 응답은 DAERI가 업무 기록과 함께 보존하고 사용자에게 전달한다. 8 기억 저장은 응답 보존에서 등록한 작업을 별도 처리하여 경험 정리·원문 저장, 선택한 임베딩·색인, 프로젝트 공유 지식 저장으로 이어진다. 저장한 지식은 같은 프로젝트·서비스의 다음 업무와 현재 접근 가능한 구성원에게 제공한다. AgentCore Memory의 업무별 대화 복구와 PostgreSQL의 공유 지식 검색을 구별한다. 핵심 기억 검색·harness 호출·응답 보존·경험 처리 코드는 구현되어 있으며 사용자 플러그인·실제 승인·멀티 에이전트·관리형 연결·상시 처리·배포는 후속 연결 범위다.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 10 6 2 10Z" fill="#79879d"/></marker>
    <marker id="tealArrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 10 6 2 10Z" fill="#32877f"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#27354a}
      .title{font-size:42px;font-weight:750;letter-spacing:-1.2px}
      .heading{font-size:32px;font-weight:700;letter-spacing:-.6px}
      .body{font-size:26px;fill:#596a7d}
      .small{font-size:24px;fill:#596a7d}
      .label{font-size:25px;fill:#51627a}
      .stage{font-size:28px;font-weight:650;letter-spacing:-.5px}
      .number{font-size:24px;font-weight:700;fill:#596a7d}
      .aws{fill:#414779}
      .daeri{fill:#16776f}
      .line{fill:none;stroke:#79879d;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .async{fill:none;stroke:#32877f;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 7;marker-end:url(#tealArrow)}
      .guide{stroke:#dce3eb;stroke-width:2;stroke-dasharray:5 10}
    </style>
  </defs>
