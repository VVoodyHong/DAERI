<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800" role="img" aria-labelledby="title desc">
  <title id="title">DAERI 서비스 흐름</title>
  <desc id="desc">위에서 아래로 읽는 목표 서비스 흐름이다. 사용자, DAERI 서비스, AWS AgentCore, 연결 도구의 네 열로 구분한다. 1 구성원은 Claude Code·Codex 플러그인에서 회사 로그인 뒤 중앙 프로젝트를 선택하고 업무를 요청한다. 2 DAERI가 프로젝트 harness를 선택하고 Harness가 독립 BYO Memory의 프로젝트 공유 경험을 자동 검색한다. 3 계획 제시 뒤 4 호스트의 사용자 확인창 응답을 현재 계획에 연결한다. 승인 Lambda hook이 같은 업무·세션의 현재 결정으로 도구 호출을 검사한다. 5 총괄 에이전트는 필요한 하위 에이전트에 MCP로 위임하고 도구 실행 뒤 근거를 통합한다. 등록된 Gateway Lambda 대상이 프로젝트·도구·하위 릴리스를 검사하고 별도 하위 세션을 실행한다. 6 Gateway·Policy·Identity와 실제 리소스 권한으로 MCP·API를 호출한다. 기본 shell·파일 도구는 harness 실행 경계를 따른다. 7 DAERI는 S3에 수신 원본과 업무 상태를 보존하고 결과를 전달한다. 8 AgentCore Memory는 경험을 비동기로 추출·통합해 같은 프로젝트 구성원의 다음 업무에 제공한다. S3 원본 보존과 Memory 경험 검색은 서로 다른 역할이다. 중앙 프로젝트·업무 조회, HTTP MCP·토큰 검증·사용자 확인·승인 hook·S3 보존·복구와 두 호스트 플러그인 배포 파일을 구현했다. 실제 호스트 설치·회사 IdP·Memory 공유·관리형 도구·AWS 배포는 연동 검증 범위다.</desc>
  <defs>
