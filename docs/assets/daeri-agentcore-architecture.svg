<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">DAERI AWS AgentCore 이관 목표 아키텍처</title>
  <desc id="desc">사용자는 Claude Code와 Codex 플러그인으로 요청하고 승인한다. DAERI 서버 연결부가 관련 기억을 제공하고 AgentCore Runtime의 managed harness를 호출한다. Harness는 모델과 도구 호출 루프를 실행하고 AgentCore Memory로 업무별 대화를 보관한다. Gateway는 리소스와 DAERI 업무 지식 도구를 연결한다. DAERI 지식 서비스가 경험을 정리하고 공용 PostgreSQL pgvector와 S3에 보관한다. 모델과 임베딩은 각각 사내 API 또는 Amazon Bedrock에서 선택한다. AWS 이관 후 구현할 목표 설계다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 9 5 1 9" fill="none" stroke="#63758a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 9 5 1 9" fill="none" stroke="#306cb5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#203247}
      .title{font-size:38px;font-weight:750;letter-spacing:-1px}.subtitle{font-size:22px;fill:#62748a}
      .group{font-size:23px;font-weight:700}.heading{font-size:26px;font-weight:750;letter-spacing:-.4px}.body{font-size:21px;fill:#506277}.small{font-size:19px;fill:#61738a}.label{font-size:20px;fill:#4d627b}.tag{font-size:18px;font-weight:650}
      .line{fill:none;stroke:#63758a;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .two{marker-start:url(#arrow)}.blue{stroke:#306cb5;marker-end:url(#blueArrow);marker-start:url(#blueArrow)}
      .providerLine{fill:none;stroke:#8a73b5;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="1320" fill="#f7f9fc"/>
  <text x="55" y="65" class="title">DAERI · AWS AgentCore 아키텍처</text>
  <text x="56" y="104" class="subtitle">AWS는 수행·연결·대화 관리를, DAERI는 업무와 공유 기억의 연결을 담당합니다.</text>
  <g transform="translate(1215 46)">
    <rect width="125" height="30" rx="15" fill="#fff0d9"/><text x="62" y="21" text-anchor="middle" class="tag" style="fill:#925313">AWS 관리형</text>
    <rect x="137" width="105" height="30" rx="15" fill="#e8f0ff"/><text x="189" y="21" text-anchor="middle" class="tag" style="fill:#275b9b">DAERI</text>
    <rect x="254" width="110" height="30" rx="15" fill="#e5f4eb"/><text x="309" y="21" text-anchor="middle" class="tag" style="fill:#26764f">공유 저장</text>
    <rect x="376" width="145" height="30" rx="15" fill="#f0eafa"/><text x="448" y="21" text-anchor="middle" class="tag" style="fill:#705497">선택 API</text>
  </g>

