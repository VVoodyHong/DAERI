<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">DAERI AWS AgentCore 아키텍처</title>
  <desc id="desc">구성원은 Claude Code·Codex 플러그인에서 회사 로그인 뒤 중앙 프로젝트를 선택하고 업무를 요청·승인한다. SSM Parameter Store는 프로젝트 이름·harness ARN을 보관한다. DAERI는 업무·실제 승인·세션을 연결하고 원래 harness에서 재개한다. Managed harness가 모델·도구 반복과 문맥을 관리하며 프로젝트별 독립 BYO Memory가 고정 공유 namespace에서 경험을 비동기로 추출·통합·검색한다. S3는 업무 상태와 DAERI가 접수·수신한 요청·응답·도구 관찰·파일 참조·산출물을 보존한다. DAERI는 불변 응답 원본 보관 뒤 상태를 확정하고 저장된 원본으로만 복구한다. Gateway·Policy·Identity가 DB·AWS·Jira·Confluence 등 중앙 도구의 연결·자격·권한을 관리한다. 생성 모델은 Harness에서 사내·호환 API 또는 Bedrock으로 선택한다. 플러그인·실제 인증·승인·Memory·도구 연결·AWS 배포는 후속 연동·검증 범위다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 9 5 1 9" fill="none" stroke="#63758a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 9 5 1 9" fill="none" stroke="#306cb5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
