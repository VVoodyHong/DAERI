<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1570" viewBox="0 0 1800 1570" role="img" aria-labelledby="title desc">
  <title id="title">DAERI AWS 서비스와 프로젝트 연결 아키텍처</title>
  <desc id="desc">운영자는 SSM에 검증한 MCP 이미지·원격 MCP·OpenAPI 카탈로그와 프로젝트별 Gateway·역할·네트워크·인증 별칭을 고정한다. 관리 권한을 가진 프로젝트 사용자가 호스트 확인창을 제출하면 DAERI 접속부의 연결 관리자가 필요한 연결별 MCP Runtime을 배포하고 프로젝트 Gateway 대상을 등록한다. 서비스 접속부 Runtime과 리소스 MCP Runtime은 별도다. 일반 구성원은 회사 인증 뒤 같은 프로젝트 연결과 Memory를 쓰며 자신의 업무와 계획 승인으로 Harness를 실행한다. 실제 호출은 Harness에서 Gateway를 거쳐 연결별 MCP Runtime에서 DB로, 기존 원격 MCP로, 또는 OpenAPI에서 REST API로 이어진다. 연결별 MCP는 시작 시 Secrets Manager 참조를 해소하고 Gateway의 원격 인증은 Identity가 담당한다. S3는 업무 상태·실제 승인·원본·파일을 보존한다. READY는 Gateway의 도구 발견 상태이며 실제 리소스 접근과 AWS 배포는 별도 검증한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 9 5 1 9" fill="none" stroke="#687b91" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 9 5 1 9" fill="none" stroke="#16776f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#203247}.title{font-size:38px;font-weight:750}.subtitle{font-size:23px;fill:#5f7187}.heading{font-size:27px;font-weight:700}.body{font-size:22px;fill:#4e6277}.small{font-size:20px;fill:#5f7187}.tag{font-size:23px;font-weight:700}.line{fill:none;stroke:#687b91;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.two{marker-start:url(#arrow)}.setup{fill:none;stroke:#16776f;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 7;marker-end:url(#greenArrow)}.aws{fill:#414779}.daeri{fill:#16776f}
    </style>
  </defs>
  <rect width="1800" height="1570" fill="#f7f9fc"/>
  <text x="55" y="65" class="title">DAERI · AWS 서비스와 프로젝트 연결</text>
  <text x="55" y="108" class="subtitle">운영자가 허용 범위를 고정하고, 프로젝트 관리자가 등록한 연결을 구성원이 함께 사용합니다.</text>
