<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1080" viewBox="0 0 480 1080" role="img" aria-labelledby="title description">
  <title id="title">DAERI 멀티 에이전트 업무 흐름</title>
  <desc id="description">총괄 에이전트가 요청을 받고 profile 기억과 기능을 확인해 계획을 제시한다. 사용자가 대화에서 승인하면 총괄이 직접 수행하거나 호스트 작업자에게 목표와 단계를 배정한다. 총괄과 작업자는 공통 MCP 실행기를 통해 승인 범위와 누적 예산 안에서 자율 수행한다. 호스트가 실제 근거와 피드백으로 보고·파일을 작성하고 내용을 검증하면 실행기가 출처·권한·무결성을 검사해 등록한다. 총괄이 선별한 기억 후보는 실행기가 검증·저장하고 선택한 임베딩 방식으로 검색 색인을 갱신한다. 다음 업무는 같은 profile의 기억을 검색해 활용한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#52637a"/>
    </marker>
    <marker id="memory-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#398371"/>
    </marker>
  </defs>
  <rect width="480" height="1080" rx="20" fill="#f5f7fb"/>
  <g fill="none" stroke="#52637a" stroke-width="2" marker-end="url(#arrow)">
    <path d="M240 134 V164"/>
    <path d="M240 260 V292"/>
    <path d="M240 374 V404"/>
    <path d="M240 602 V632"/>
    <path d="M240 732 V764"/>
    <path d="M240 854 V886"/>
  </g>
  <path d="M420 938 H458 V212 H424" fill="none" stroke="#398371" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#memory-arrow)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" text-anchor="middle">
    <text x="240" y="31" fill="#40536c" font-size="19" font-weight="700">DAERI · 멀티 에이전트 업무 흐름</text>
    <g fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5">
      <rect x="36" y="54" width="384" height="80" rx="14"/>
      <rect x="36" y="164" width="384" height="96" rx="14"/>
      <rect x="36" y="292" width="384" height="82" rx="14" fill="#e8f2ff" stroke="#759fe0"/>
      <rect x="24" y="404" width="420" height="198" rx="14" fill="#eff0fc" stroke="#9298d0"/>
      <rect x="40" y="454" width="188" height="82" rx="12"/>
      <rect x="252" y="454" width="176" height="82" rx="12"/>
      <rect x="36" y="632" width="384" height="100" rx="14"/>
      <rect x="36" y="764" width="384" height="90" rx="14"/>
      <rect x="36" y="886" width="384" height="104" rx="14" fill="#e8f6f0" stroke="#79ad99"/>
    </g>
    <g fill="#16253b" font-size="21" font-weight="700">
      <text x="228" y="86">1. 업무 요청</text>
      <text x="228" y="198">2. 기억 조회·계획 제시</text>
      <text x="228" y="325">3. 대화에서 계획 승인</text>
      <text x="234" y="436" font-size="20">4. 총괄이 필요한 작업을 배정</text>
      <text x="134" y="484" font-size="18">총괄의 직접 수행</text>
      <text x="340" y="484" font-size="18">작업자 1 … N</text>
      <text x="228" y="666">5. 공통 MCP 실행기</text>
      <text x="228" y="798">6. 보고·파일 작성과 등록</text>
      <text x="228" y="920">7. 실행기가 자동 기억</text>
    </g>
    <g fill="#40536c" font-size="17">
      <text x="228" y="113">사용자 → Claude Code / Codex의 총괄</text>
      <text x="228" y="225">profile의 경험·등록 기능 확인</text>
      <text x="228" y="247">방법 · 리소스 · 결과 · 기억 범위</text>
      <text x="228" y="352">사용자: 승인 · 수정 · 피드백</text>
      <text x="134" y="512">판단 ↔ 관찰</text>
      <text x="340" y="512">판단 ↔ 관찰</text>
      <text x="234" y="566" font-size="18">목표·단계 안에서 자율 수행</text>
      <text x="234" y="589" font-size="16">호스트가 작업자의 생성·추론을 담당</text>
      <text x="228" y="694">호출마다 승인·위임·공유 예산 검사</text>
      <text x="228" y="717">어댑터·하위 MCP → 연결 리소스</text>
      <text x="228" y="827">호스트 작성·검증 → 실행기 등록</text>
      <text x="228" y="948">선별 지식 검증·저장·검색 색인</text>
      <text x="228" y="974">키워드 / 로컬 임베딩 / 회사 API</text>
    </g>
    <text x="240" y="1032" fill="#398371" font-size="17">점선: 다음 업무에서 profile 기억 활용</text>
    <text x="240" y="1060" fill="#52637a" font-size="16">작업자 수와 역할은 업무에 맞춰 선택</text>
  </g>
</svg>
